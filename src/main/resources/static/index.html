<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grouped Tasks</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="text-center mb-4">Grouped Open Tasks</h1>
      <button
        class="btn btn-primary btn-sm"
        onclick="createNewProcessInstance()"
      >
        Create New Process Instance
      </button>
      <div id="taskGroupsContainer">
        <!-- Dynamic grouped tasks will be injected here -->
      </div>
      <div id="errorMessage" class="mt-4"></div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      async function createNewProcessInstance() {
        try {
          const payload = {
            processDefinitionId: "review-application", // Replace with your deployed process ID
            version: -1, // Use -1 for the latest version
            variables: {}, // Optional variables
          };

          // Send the JSON payload to Camunda to create a new process instance
          const response = await fetch(
            "http://192.168.102.231:8088/v2/process-instances",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(payload),
            }
          );

          if (response.ok) {
            // Parse the response JSON
            const responseData = await response.json();

            // Display a success message and show process instance details
            document.getElementById("responseMessage").innerHTML = `
        <div class="alert alert-success">
          Process instance created successfully!<br>
          Instance Key: ${responseData.processInstanceKey}
        </div>
      `;

            // Optionally redirect the user to another page
            window.location.href = "/";
          } else {
            // Handle server-side errors
            const errorData = await response.json();
            document.getElementById("responseMessage").innerHTML = `
        <div class="alert alert-danger">
          Failed to create process instance.<br>
          Status: ${response.status} ${response.statusText}<br>
          Error: ${errorData.message || "No additional details provided."}
        </div>
      `;
          }
        } catch (error) {
          // Handle client-side or network errors
          document.getElementById("responseMessage").innerHTML = `
      <div class="alert alert-danger">
        A network or client-side error occurred.<br>
        Error: ${error.message}
      </div>
    `;
        }
      }

      async function getAccessToken() {
        const tokenUrl =
          "http://192.168.102.231:18080/auth/realms/camunda-platform/protocol/openid-connect/token";

        const params = new URLSearchParams();
        params.append("client_id", "test_app");
        params.append("client_secret", "IwLlHJ4yVemHYuspZjMmpQxJsUZfM4Il");
        params.append("grant_type", "client_credentials");

        try {
          const response = await fetch(tokenUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: params,
          });

          if (!response.ok) {
            throw new Error(
              `Failed to fetch access token: ${response.statusText}`
            );
          }

          const data = await response.json();
          return data.access_token;
        } catch (error) {
          console.error("Error obtaining access token:", error.message);
          throw error;
        }
      }

      async function fetchTasks() {
        try {
          const accessToken = await getAccessToken();
          const response = await fetch(
            "http://192.168.102.231:8082/v1/tasks/search",
            {
              method: "POST",
              headers: {
                Authorization: `Bearer ${accessToken}`,
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              content: {},
            }
          );

          if (!response.ok) {
            throw new Error(`Failed to fetch tasks: ${response.statusText}`);
          }

          const tasks = await response.json();

          // Group tasks by processInstanceKey
          const groupedTasks = tasks.reduce((groups, task) => {
            const key = task.processInstanceKey || "Unknown Instance";
            if (!groups[key]) {
              groups[key] = [];
            }
            groups[key].push(task);
            return groups;
          }, {});

          // Get the container for task groups
          const taskGroupsContainer = document.getElementById(
            "taskGroupsContainer"
          );

          // Clear the container
          taskGroupsContainer.innerHTML = "";

          if (Object.keys(groupedTasks).length === 0) {
            // Display a message if no tasks are available
            taskGroupsContainer.innerHTML = `
              <div class="alert alert-info text-center">
                No open tasks available
              </div>
            `;
          } else {
            // Create a table for each process instance key
            for (const processInstanceKey in groupedTasks) {
              const group = groupedTasks[processInstanceKey];

              // Create a table for the group
              const table = document.createElement("table");
              table.className = "table table-striped table-bordered mt-4";

              // Add a table header
              const thead = `
                <thead class="table-dark">
                  <tr>
                    <th colspan="6">Process Instance: ${processInstanceKey}</th>
                  </tr>
                  <tr>
                    <th>Task ID</th>
                    <th>Name</th>
                    <th>Assignee</th>
                    <th>Process Name</th>
                    <th>Task State</th>
                    <th>Actions</th>
                  </tr>
                </thead>
              `;
              table.innerHTML = thead;

              // Add table body
              const tbody = document.createElement("tbody");
              group.forEach((task) => {
                const pageName =
                  task.name == "Declare COI"
                    ? "coi"
                    : task.name == "Review by SR"
                    ? "sr_review"
                    : "er_review";

                const row = `
                  <tr>
                    <td>${task.id}</td>
                    <td>${task.name}</td>
                    <td>${task.assignee || "Unassigned"}</td>
                    <td>${task.processName}</td>
                    <td>${task.taskState}</td>
                    <td>
                      <a
                        href="http://localhost:8081/forms/${pageName}.html?taskId=${
                  task.id
                }"
                        class="btn btn-primary btn-sm"
                      >
                        Open Form
                      </a>
                      <button
                        class="btn btn-secondary btn-sm"
                        onclick="assignTaskToDemo('${task.id}')"
                      >
                        Assign to demo
                      </button>
                    </td>
                  </tr>
                `;
                tbody.innerHTML += row;
              });

              // Append the tbody to the table
              table.appendChild(tbody);

              // Append the table to the container
              taskGroupsContainer.appendChild(table);
            }
          }
        } catch (error) {
          console.error("Error fetching tasks:", error);
          document.getElementById("errorMessage").innerHTML = `
            <div class="alert alert-danger">
              Unable to fetch tasks: ${error.message}
            </div>
          `;
        }
      }

      async function assignTaskToDemo(taskId) {
        try {
          const accessToken = await getAccessToken();
          const response = await fetch(
            `http://192.168.102.231:8088/v2/user-tasks/${taskId}/assignment`,
            {
              method: "POST",
              headers: {
                Authorization: `Bearer ${accessToken}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                assignee: "demo",
                allowOverrideAssignment: true,
              }),
            }
          );

          if (!response.ok) {
            throw new Error(
              `Failed to assign task ${taskId} to demo: ${response.statusText}`
            );
          }

          alert(`Task ${taskId} successfully assigned to demo!`);
          fetchTasks();
        } catch (error) {
          console.error("Error assigning task:", error);
          alert(`Error assigning task: ${error.message}`);
        }
      }

      // Fetch tasks when the page loads
      window.onload = fetchTasks;
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COI Form</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 class="text-center mb-4">COI Form</h1>
      <form id="coiForm" class="p-4 border rounded">
        <!-- Dropdown for COI -->
        <div class="mb-3">
          <label for="coi" class="form-label"
            >Do you have a Conflict of Interest (COI)?</label
          >
          <select id="coi" class="form-select" required>
            <option value="" disabled selected>Select an option</option>
            <option value="yes">Yes</option>
            <option value="no">No</option>
          </select>
        </div>
        <button type="button" class="btn btn-primary" onclick="submitForm()">
          Submit
        </button>
      </form>
      <div id="responseMessage" class="mt-4"></div>
      <a href="http://localhost:8081/" class="btn btn-primary btn-sm"> Back </a>
    </div>

    <!-- Bootstrap JS (optional, only needed for advanced Bootstrap components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      async function getAccessToken() {
        const tokenUrl =
          "http://192.168.102.231:18080/auth/realms/camunda-platform/protocol/openid-connect/token";

        const params = new URLSearchParams();
        params.append("client_id", "test_app");
        params.append("client_secret", "IwLlHJ4yVemHYuspZjMmpQxJsUZfM4Il");
        params.append("grant_type", "client_credentials");

        try {
          const response = await fetch(tokenUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
            },
            body: params,
          });

          if (!response.ok) {
            throw new Error(
              `Failed to fetch access token: ${response.statusText}`
            );
          }

          const data = await response.json();
          return data.access_token; // Return the access token
        } catch (error) {
          console.error("Error obtaining access token:", error.message);
          throw error;
        }
      }
      async function submitForm() {
        const accessToken = getAccessToken();
        // Get the selected value from the dropdown
        const coi = document.getElementById("coi").value;

        // Check if a valid option is selected
        if (!coi) {
          document.getElementById("responseMessage").innerHTML = `
            <div class="alert alert-warning">Please select an option.</div>
          `;
          return;
        }

        // Get the task ID from the URL parameters (provided by Camunda)
        const urlParams = new URLSearchParams(window.location.search);
        const taskId = urlParams.get("taskId");

        // Check if the task ID is present
        if (!taskId) {
          document.getElementById("responseMessage").innerHTML = `
            <div class="alert alert-danger">Task ID is missing!</div>
          `;
          return;
        }

        // Create the payload for Camunda
        const payload = {
          variables: {
            coi_key: coi,
          },
        };

        try {
          // Send the JSON payload to Camunda to complete the task
          const response = await fetch(
            `http://192.168.102.231:8088/v2/user-tasks/${taskId}/completion`,
            {
              method: "POST",
              headers: {
                Authorization: `Bearer ${accessToken}`,
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify(payload),
            }
          );

          if (response.ok) {
            // Display a success message
            document.getElementById("responseMessage").innerHTML = `
              <div class="alert alert-success">Task completed successfully!</div>
            `;
            // Optionally redirect the user to another page
            window.location.href = "/";
          } else {
            // Handle server-side errors
            const errorData = await response.json();
            document.getElementById("responseMessage").innerHTML = `
              <div class="alert alert-danger">Error completing task: ${errorData.message}</div>
            `;
          }
        } catch (error) {
          // Handle client-side or network errors
          document.getElementById("responseMessage").innerHTML = `
            <div class="alert alert-danger">Error submitting form: ${error.message}</div>
          `;
        }
      }
    </script>
  </body>
</html>
